<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Primtal Checker</title>
    <link rel="shortcut icon" href="assets/img/download.jpg" type="image/x-icon">
    <link rel="stylesheet" href="assets/css/site.css">
    <script src="assets/java/lilletal.js" defer></script>
    <script src="assets/java/stortal.js" defer></script>
</head>
<body>
    <h1>Primtal Checker</h1>

    <section>
        <h2>Lille tal</h2>
        <input type="text" id="smallNumberInput" placeholder="Skriv et lille tal her">
        <button id="smallCheckButton">Check lille tal</button>
        <p id="smallResult"></p>
    </section>

    <section>
        <h2>Stort tal</h2>
        <input type="text" id="bigNumberInput" placeholder="Skriv et stort tal her">
        <button id="bigCheckButton">Check stort tal</button>
        <p id="bigResult"></p>
    </section>

    <section id="box">


    </section>

</body>
</html>
